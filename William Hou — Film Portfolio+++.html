<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>William Hou — Film Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500..700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#e4e0d6;--card:#fff;--ink:#333;--mute:#9a9a9a;--line:#dedbd3;--link:#3f729b;--bar1:#5d89b5;--bar2:#2f5c8a;--lines1:rgba(255,255,255,.22);--lines2:rgba(0,0,0,.035);--tile-edge:#fff;--seg:#7a7a7a;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 60px)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:400 15px/1.45 "Helvetica Neue",Helvetica,Arial,sans-serif;min-height:100vh;background-color:var(--bg);
  background-image:repeating-linear-gradient(0deg,var(--lines1) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,var(--lines2) 0 1px,transparent 1px 3px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar1);z-index:30}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--link);outline-offset:2px}
[hidden]{display:none!important}
svg{display:block}
/* blue nav bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:48px;background:linear-gradient(var(--bar1),var(--bar2));border-bottom:1px solid #1f4468;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 1px 4px rgba(0,0,0,.35)}
.bar div{max-width:760px;height:100%;margin:0 auto;padding:0 14px;display:flex;align-items:center;justify-content:space-between;position:relative}
.bar h1{position:absolute;left:0;right:0;margin:0;text-align:center;font:700 19px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:#fff;text-shadow:0 -1px 0 rgba(0,0,0,.45);pointer-events:none}
.nb{position:relative;z-index:1;display:flex;align-items:center;height:30px;color:#fff!important;font-weight:700;font-size:14px;text-shadow:0 -1px 0 rgba(0,0,0,.4);background:linear-gradient(#3f6d9b,#244d78);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);border-radius:4px}
.nb:hover{text-decoration:none;filter:brightness(1.1)}
.back{padding:0 12px 0 16px;margin-left:10px;border-radius:0 4px 4px 0;clip-path:polygon(12px 0,100% 0,100% 100%,12px 100%,0 50%)}
.share{width:40px;justify-content:center}
.col{max-width:760px;margin:0 auto;padding:16px 14px 0}
.round{background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.12)}
/* profile card */
.top{display:flex;gap:18px;padding:14px;align-items:center}
.avatar{flex:none;width:clamp(84px,17vw,128px);aspect-ratio:1;border-radius:6px;background:linear-gradient(135deg,#f6c07a,#d9576b 55%,#6a4c93);display:grid;place-items:center;color:#fff;font:700 clamp(28px,6vw,46px) "Helvetica Neue",Arial,sans-serif;border:1px solid #b9b5ab;box-shadow:inset 0 0 0 3px #fff,0 1px 3px rgba(0,0,0,.3);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.right{flex:1;min-width:0}
.stats{display:flex;margin:0;padding:0;list-style:none}
.stats li{flex:1;text-align:center;padding:2px 6px;border-left:1px solid var(--line)}
.stats li:first-child{border-left:0}
.stats b{display:block;font-size:clamp(20px,3.6vw,28px);line-height:1.15;font-weight:700;color:var(--ink)}
.stats span{font-size:13px;color:var(--mute)}
.follow{display:block;margin-top:12px;text-align:center;padding:9px 12px;border-radius:5px;color:#fff!important;font-weight:700;font-size:16px;text-shadow:0 -1px 0 rgba(0,0,0,.4);background:linear-gradient(#4f86b8,#2a5f93);border:1px solid #1d4a75;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.follow:hover{text-decoration:none;filter:brightness(1.08)}
.bio{border-top:1px solid var(--line);padding:14px 16px 16px}
.bio b{display:block;font-size:22px;line-height:1.2}
.bio p{margin:6px 0 0;color:#444;font-size:17px;max-width:54ch}.bio p a{font-size:16px}
/* segmented tab card */
.segs{display:flex;margin-top:14px;position:relative}
.segs a{position:relative;flex:1;display:flex;align-items:center;justify-content:center;gap:9px;height:56px;color:var(--seg);font-weight:700;font-size:16px;border-left:1px solid var(--line)}
.segs a:first-child{border-left:0;border-radius:8px 0 0 8px}.segs a:last-child{border-radius:0 8px 8px 0}
.segs a:hover{text-decoration:none;background:rgba(0,0,0,.03)}
.segs a[aria-current="page"]{color:var(--link)}
.segs a[aria-current="page"]::after{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-10px;border:10px solid transparent;border-top:0;border-bottom:10px solid var(--card);filter:drop-shadow(0 -1px 0 var(--line))}
.segs svg{width:24px;height:24px}
.view{padding-top:22px}
/* photo grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(6px,1.6vw,14px)}
.tile{position:relative;aspect-ratio:1;border:5px solid var(--tile-edge);box-shadow:0 1px 3px rgba(0,0,0,.35);background:#222;overflow:hidden;display:block;color:#fff}
.tile img{width:100%;height:100%;object-fit:cover}
.tile .t{position:absolute;inset:auto 0 0;padding:22px 8px 8px;background:linear-gradient(transparent,rgba(0,0,0,.7));font-weight:700;font-size:clamp(11px,2vw,15px);line-height:1.2}
.tile:hover{text-decoration:none}
.tile:hover .ph-bg{filter:sepia(.35) saturate(1.3) brightness(1.2)}
.ph-bg{position:absolute;inset:0;filter:sepia(.35) saturate(1.3) contrast(1.05) brightness(1.05)}
.ph-bg::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,transparent 55%,rgba(0,0,0,.35))}
.post{margin:0 0 22px;overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;padding:12px 14px}
.ph .mini img{display:block;width:100%;height:100%;object-fit:cover}
.ph .mini{overflow:hidden;width:34px;height:34px;border-radius:4px;background:linear-gradient(135deg,#f6c07a,#d9576b 55%,#6a4c93);flex:none}
.ph b{color:var(--link);font-size:16px}.ph small{margin-left:auto;color:var(--mute);font-size:13px}
.media{position:relative;aspect-ratio:1;background:#111;color:#fff;display:grid;place-items:center;overflow:hidden;font-size:14px;text-align:center}
.media.wide{aspect-ratio:16/9}
.media iframe,.media img{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.media .t{position:relative;font-weight:700;padding:0 14px}
.cap{padding:12px 14px 14px}.cap p{margin:0 0 6px}.cap .meta{color:var(--mute);font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0;padding:0;list-style:none;font-size:18px}
.tags li{color:var(--link)}.tags small{color:var(--mute);font-size:13px;margin-left:5px}
.pad{padding:clamp(18px,4vw,30px);margin-bottom:22px}
.pad p{margin:0 0 12px;font-size:17px}
h2.sec{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:20px 0 12px;font-weight:700}
.big{font:300 clamp(22px,4.6vw,36px)/1.15 "Helvetica Neue",Arial,sans-serif;overflow-wrap:anywhere}
.links{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 0;padding:0;list-style:none}
.links a{display:inline-block;padding:7px 18px;border-radius:5px;color:#fff;font-weight:700;font-size:14px;text-shadow:0 -1px 0 rgba(0,0,0,.4);background:linear-gradient(#4f86b8,#2a5f93);border:1px solid #1d4a75;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.links a:hover{text-decoration:none;filter:brightness(1.08)}
.comment{display:flex;gap:8px;margin-top:20px;border-top:1px solid var(--line);padding-top:16px}
.comment input{flex:1;min-width:0;border:1px solid var(--line);border-radius:5px;padding:9px 11px;font:inherit;background:var(--bg);color:var(--ink)}
.comment button{padding:0 20px;border-radius:5px;color:#fff;font:700 14px "Helvetica Neue",Arial,sans-serif;text-shadow:0 -1px 0 rgba(0,0,0,.4);background:linear-gradient(#4f86b8,#2a5f93);border:1px solid #1d4a75;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
button.follow{width:100%;cursor:pointer;font-family:inherit}
.follow[aria-expanded="true"] span{display:inline-block;transform:rotate(180deg)}
.menu{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--line);color:var(--ink)}
.menu>.row:first-child{border-top:0}
.row:hover{background:rgba(63,114,155,.08);text-decoration:none}
.row b{display:block;font-size:16px}.row small{display:block;color:var(--mute);font-size:13px}
.row .v{color:var(--link);font-size:16px;text-align:right;overflow-wrap:anywhere}
.menu .comment{margin:0;border-top:1px solid var(--line);padding:12px 16px}
.right{position:relative}
button.follow{position:relative;padding-left:40px;padding-right:40px}
.follow span{position:absolute;right:0;top:0;bottom:0;width:38px;display:grid!important;place-items:center;border-left:1px solid rgba(0,0,0,.25);box-shadow:inset 1px 0 0 rgba(255,255,255,.25);transform:none!important}
.follow[aria-expanded="true"]{filter:brightness(.92)}
.menu{position:absolute;z-index:15;right:0;top:calc(100% + 12px);width:min(380px,calc(100vw - 44px));background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.2);text-align:left}
.menu:not([hidden]){animation:drop .16s ease-out}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}}
.menu::before{content:"";position:absolute;top:-7px;right:13px;width:12px;height:12px;background:var(--card);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
#emailRow{border-radius:10px 10px 0 0}
#links .row:last-child{border-radius:0 0 10px 10px}
.crumbs{position:absolute;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:9px;pointer-events:none;font:700 17px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.04em;text-transform:uppercase;text-shadow:0 -1px 0 rgba(0,0,0,.45);white-space:nowrap}
.crumbs a{pointer-events:auto;color:rgba(255,255,255,.72)}
.crumbs a:hover{color:#fff;text-decoration:none}
.crumbs i{font-style:normal;font-weight:400;color:rgba(255,255,255,.5);font-size:20px;transform:translateY(-1px)}
.crumbs b{color:#fff}
@media (max-width:640px){.back{display:none}}
@media (max-width:420px){.crumbs{font-size:13px;gap:6px}.crumbs i{font-size:16px}}
.quote{display:inline-block;margin-top:2px;font-family:"Dancing Script","Segoe Script",cursive;font-weight:600;font-size:20px;line-height:1.4}
button.avatar{padding:0;cursor:zoom-in}
.lb{position:fixed;inset:0;z-index:50;background:rgba(10,10,10,.78);display:grid;place-items:center;padding:20px;animation:drop .16s ease-out}
.lb img{width:min(560px,86vmin);aspect-ratio:1;object-fit:cover;border:6px solid #fff;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.lbx{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.6);background:rgba(0,0,0,.4);color:#fff;font:400 26px/1 Arial,sans-serif;cursor:pointer}
.tile{cursor:pointer;padding:0;font:inherit}
.tile.blank{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.3),inset 0 0 0 1px var(--line)}
.tile.blank:hover{filter:brightness(.97)}
.pm{position:fixed;inset:0;z-index:50;background:rgba(10,10,10,.78);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 16px;overflow:auto;animation:drop .16s ease-out}
.pcard{width:min(560px,100%);max-height:100%;overflow:auto;margin:auto}
.pmx{margin-left:auto;width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:var(--mute);font:400 26px/1 Arial,sans-serif;cursor:pointer}
.pgal{position:relative;aspect-ratio:4/3;background:#1b1b1b;color:#bbb;display:grid;place-items:center;font-size:15px}
.pimg{position:absolute;inset:0;display:grid;place-items:center}
.pimg{overflow:hidden}
.track{display:flex;width:100%;height:100%}
.slide{flex:0 0 100%;height:100%}
.slide img{display:block;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
.pgal{touch-action:pan-y;user-select:none}
.pn{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.45);color:#fff;font:400 24px/1 Arial,sans-serif;cursor:pointer}
.pn.prev{left:10px}.pn.next{right:10px}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5)}.dots i.on{background:#fff}
.igl{position:relative;z-index:1;display:block;width:32px;height:32px;margin-right:2px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
.igl img{display:block;width:100%;height:100%}
.igl:hover{filter:drop-shadow(0 1px 2px rgba(0,0,0,.45)) brightness(1.08)}
.splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background-color:var(--bg);background-image:radial-gradient(circle at 50% 44%,rgba(255,255,255,.6),transparent 62%),repeating-linear-gradient(0deg,var(--lines1) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,var(--lines2) 0 1px,transparent 1px 3px);transform-origin:50% 42%;animation:zoomIn .7s cubic-bezier(.65,0,.9,.35) 1.9s forwards;cursor:pointer}
.splash::after{content:"";position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;animation:flash .4s ease-out 1.5s}
.sp-in{text-align:center;transform:translateY(-4%)}
.sp-in img{display:block;width:clamp(96px,22vmin,148px);height:auto;margin:0 auto;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35));animation:pop .6s cubic-bezier(.2,1.4,.4,1) .15s both}
.sp-name{font:600 clamp(32px,7vmin,48px)/1.1 "Dancing Script","Segoe Script",cursive;color:#3b3a36;text-shadow:0 1px 0 rgba(255,255,255,.8);margin-top:18px;animation:rise .5s ease-out .75s both}
.sp-sub{font:700 12px "Helvetica Neue",Arial,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#8b877d;margin-top:6px;padding-left:.3em;animation:rise .5s ease-out .95s both}
@keyframes pop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes flash{0%{opacity:0}18%{opacity:.95}100%{opacity:0}}
@keyframes zoomIn{to{transform:scale(8);opacity:0}}
.intro .tile{animation:develop .8s ease-out backwards;animation-delay:calc(.2s + var(--i,0) * 70ms)}
@keyframes develop{from{opacity:0;filter:sepia(1) blur(3px) brightness(1.3)}to{opacity:1;filter:none}}
@media (prefers-reduced-motion:reduce){.splash{display:none}}
.media.slider{aspect-ratio:4/3;touch-action:pan-y;user-select:none}
.media .slide img{position:static}
.media .track{position:absolute;inset:0;width:auto;height:auto}
#pmBio,.cap p{white-space:pre-line}
.media.gal{aspect-ratio:4/3}
.poster{container-type:inline-size;position:absolute;inset:0;overflow:hidden;color:#efe9dc;background:radial-gradient(120% 90% at 50% 40%,var(--a),var(--b))}
.poster::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,transparent 55%,rgba(0,0,0,.45));pointer-events:none}
.poster .frame{position:absolute;inset:4cqw;border:1px solid rgba(239,233,220,.35);pointer-events:none}
.poster .pin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:3cqw;text-align:center;padding:9cqw 8cqw}
.poster .pt{flex:none;font:700 min(4cqw,14px)/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.3em;padding-left:.3em;text-transform:uppercase;color:rgba(239,233,220,.7)}
.poster .pn{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;width:100%;padding:0 2cqw;font:800 min(9cqw,56px)/1.12 "Helvetica Neue",Arial,sans-serif;text-transform:uppercase;letter-spacing:.02em;overflow-wrap:break-word}
.poster .pn.long{font-size:min(7.5cqw,46px)}
.poster .pr{flex:none;font:600 min(4.6cqw,15px)/1.2 "Helvetica Neue",Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(239,233,220,.8)}
@container (max-width:150px){.poster .pt,.poster .pr{display:none}.poster .pin{padding:8cqw 7cqw}.poster .pn{font-size:13cqw}.poster .pn.long{font-size:10.5cqw}}
.badge{position:absolute;top:10px;left:10px;z-index:2;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font:700 11px "Helvetica Neue",Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;pointer-events:none}
.tile.letter{background:#111}
.tile.letter img.fit{position:absolute;left:0;right:0;top:0;width:100%;height:auto}
.lbt{position:absolute;left:0;right:0;height:24%;display:grid;place-items:center;padding:0 6px;color:#e9e6df;font:700 clamp(8px,1.5vw,11px)/1.25 "Helvetica Neue",Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;text-align:center}
.lbt.top{top:0}.lbt.bot{bottom:0;height:46%;color:#e9e6df;font-size:clamp(11px,2.6vw,19px);letter-spacing:.16em;line-height:1.35;align-content:center;row-gap:.35em}
.lbt .lt{font-size:1.15em;letter-spacing:.06em;line-height:1.15;color:#fff}
.lbt.bot.two{grid-template-rows:auto auto;align-content:center;row-gap:.5em}
.lbt.bot.two>span{font-size:.72em;letter-spacing:.22em;padding-left:.22em;color:rgba(233,230,223,.8)}
@media (max-width:560px){.lbt.bot{font-size:10px;letter-spacing:.06em}.lbt .lt{font-size:1em}.lbt.bot.two>span{font-size:.8em;letter-spacing:.14em}}
#tagline{white-space:pre-line}
footer{text-align:center;color:var(--mute);font-size:12px;padding:6px 0 34px}
@media (max-width:520px){.segs a{font-size:0;gap:0}.segs a svg{width:26px;height:26px}.bio p{font-size:15px}.nb.back{font-size:13px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="splash" id="splash" aria-hidden="true"><div class="sp-in"><img id="spLogo" alt=""><div class="sp-name" id="spName">William Hou</div><div class="sp-sub">film portfolio</div></div></div>
<header class="bar"><div>

$("skills").innerHTML = SITE.skills.map(([t, d]) => `<li>#${esc(t)}${d ? `<small>${esc(d)}</small>` : ""}</li>`).join("");
$("emailRow").href = "mailto:" + SITE.email; $("email").textContent = SITE.email;
$("links").innerHTML = SITE.links.map(([t, u, n]) => `<a class="row" href="${esc(u)}" target="_blank" rel="noopener"><span><b>${esc(t)}</b>${n ? `<small>${esc(n)}</small>` : ""}</span><span class="v">›</span></a>`).join("");
$("foot").textContent = "© " + new Date().getFullYear() + " " + SITE.name;

const POSTER = [["#2a5565", "#0c1a20"], ["#6a2c40", "#1d0c13"], ["#4b5330", "#151809"], ["#3a4468", "#10131e"], ["#7a4526", "#22110a"]];
function poster(title, role, i) {
  const c = POSTER[i % POSTER.length];
  return `<div class="poster" style="--a:${c[0]};--b:${c[1]}"><i class="frame"></i><div class="pin"><span class="pt">Coming soon</span><b class="pn${title.length > 16 ? " long" : ""}">${esc(title)}</b><span class="pr">${esc(role)}</span></div></div>`;
}
function tileInner(g, i) {
  if (!g) return "";
  if (!g.images || !g.images[0]) return poster(g.title, (g.meta || "").split(" · ")[0], i);
  const src = esc(g.thumb || g.images[0]);
  if (g.fit === "letterbox") return `${g.top ? `<span class="lbt top">${esc(g.top)}</span>` : ""}<img class="fit" src="${src}" alt="" loading="lazy"><span class="lbt bot${g.showTitle && g.bottom ? " two" : ""}">${g.showTitle ? `<b class="lt">${esc(g.title)}</b>` : ""}${g.bottom ? `<span>${esc(g.bottom).split(" · ").join("<br>")}</span>` : ""}</span>`;
  return `<img src="${src}" alt="" loading="lazy">`;
}
const GRID_N = SITE.grid.length;
$("grid").innerHTML = Array.from({ length: GRID_N }, (_, i) => { const g = SITE.grid[i]; return `<button class="tile${g ? (g.fit === "letterbox" ? " letter" : "") : " blank"}" type="button" data-i="${i}" style="--i:${i}" aria-label="${g ? esc(g.title) : "Empty post " + (i + 1)}">${tileInner(g, i)}</button>`; }).join("");

const pm = $("pm"); let cur = { images: [] }, idx = 0;
function go(i) {
  const n = cur.images.length; if (!n) { $("pprev").hidden = $("pnext").hidden = true; $("pdots").innerHTML = ""; return; }
  idx = Math.max(0, Math.min(n - 1, i));
  const t = $("track"); if (t) { t.style.transition = "transform .35s ease"; t.style.transform = `translateX(${-idx * 100}%)`; }
  $("pdots").innerHTML = n > 1 ? cur.images.map((_, j) => `<i class="${j === idx ? "on" : ""}"></i>`).join("") : "";
  $("pprev").hidden = n < 2 || idx === 0; $("pnext").hidden = n < 2 || idx === n - 1;
}
function showImg() {
  const im = cur.images;
  $("pimg").innerHTML = im.length ? `<div class="track" id="track">${im.map((u, j) => `<div class="slide"><img src="${esc(u)}" alt="${esc(cur.title)}, photo ${j + 1} of ${im.length}" draggable="false"></div>`).join("")}</div>` : poster(cur.title, cur.role || "", cur.i || 0);
  go(0);
}
(function () { /* swipe or drag to slide */
  const g = document.querySelector(".pgal"); let x0 = null, dx = 0, w = 1;
  g.addEventListener("pointerdown", e => { if (e.target.closest(".pn") || cur.images.length < 2) return; x0 = e.clientX; dx = 0; w = g.clientWidth; $("track").style.transition = "none"; g.setPointerCapture(e.pointerId); });
  g.addEventListener("pointermove", e => { if (x0 === null) return; dx = e.clientX - x0; $("track").style.transform = `translateX(calc(${-idx * 100}% + ${dx}px))`; });
  const end = () => { if (x0 === null) return; const d = dx; x0 = null; go(Math.abs(d) > w * 0.15 ? idx + (d < 0 ? 1 : -1) : idx); };
  g.addEventListener("pointerup", end); g.addEventListener("pointercancel", end);
})();
function openPost(i) {
  const g = SITE.grid[i] || {};
  cur = { title: g.title || "Coming soon", images: g.images || [], role: (g.meta || "").split(" · ")[0], i }; idx = 0;
  $("pmAv").innerHTML = SITE.avatar ? `<img src="${esc(SITE.avatar)}" alt="">` : "";
  $("pmUser").textContent = SITE.handle; $("pmTitle").textContent = cur.title;
  $("pmBio").textContent = g.bio || "Project details coming soon. Check back for photos, stills and behind-the-scenes notes.";
  $("pmMeta").textContent = g.meta || "";
  $("pbadge").textContent = g.badge || ""; $("pbadge").hidden = !g.badge;
  $("pmLink").innerHTML = g.link ? `<a href="${esc(g.link)}" target="_blank" rel="noopener">Watch on ${esc(g.linkLabel || "YouTube")}</a>` : "";
  showImg(); pm.hidden = false; $("pmx").focus();
}
function closePost() { pm.hidden = true; }
$("grid").onclick = e => { const t = e.target.closest(".tile"); if (t) openPost(+t.dataset.i); };
pm.onclick = e => { if (e.target === pm) closePost(); };
$("pmx").onclick = closePost;
$("pprev").onclick = () => go(idx - 1);
$("pnext").onclick = () => go(idx + 1);
addEventListener("keydown", e => { if (pm.hidden) return; if (e.key === "Escape") closePost(); if (cur.images.length > 1 && e.key === "ArrowLeft") $("pprev").click(); if (cur.images.length > 1 && e.key === "ArrowRight") $("pnext").click(); });

$("feed").innerHTML = SITE.projects.map((p, i) => `<article class="round post"><div class="ph"><div class="mini"></div><b>${esc(p.title)}</b><small>${esc(p.year)}</small></div>
  <div class="media gal" data-p="${i}">${p.images && p.images.length ? "" : (p.image ? still(p, i) : poster(p.title, p.role, i))}</div>
  <div class="cap"><p><b>${esc(SITE.handle)}</b> ${esc(p.note)}</p><p class="meta">${[p.role, p.format, p.runtime].filter(Boolean).map(esc).join(" · ")}</p><p class="meta">${esc(p.crew)}</p>${p.link ? `<p><a href="${esc(p.link)}">Watch ${esc(p.title)}</a></p>` : ""}</div></article>`).join("");

function buildSlider(el, im, title, badge) {
  el.classList.add("slider");
  el.innerHTML = `<div class="track">${im.map((u, j) => `<div class="slide"><img src="${esc(u)}" alt="${esc(title)}, photo ${j + 1} of ${im.length}" draggable="false" loading="lazy"></div>`).join("")}</div>` + (im.length > 1 ? `<button class="pn prev" type="button" aria-label="Previous photo">‹</button><button class="pn next" type="button" aria-label="Next photo">›</button><div class="dots"></div>` : "");
  if (badge) el.insertAdjacentHTML("beforeend", `<span class="badge">${esc(badge)}</span>`);
  const t = el.querySelector(".track"), pv = el.querySelector(".prev"), nx = el.querySelector(".next"), dt = el.querySelector(".dots");
  let i = 0, x0 = null, dx = 0, w = 1;
  const go = n => {
    i = Math.max(0, Math.min(im.length - 1, n)); t.style.transition = "transform .35s ease"; t.style.transform = `translateX(${-i * 100}%)`;
    if (dt) dt.innerHTML = im.map((_, j) => `<i class="${j === i ? "on" : ""}"></i>`).join("");
    if (pv) { pv.hidden = i === 0; nx.hidden = i === im.length - 1; }
  };
  if (pv) { pv.onclick = () => go(i - 1); nx.onclick = () => go(i + 1); }
  el.addEventListener("pointerdown", e => { if (im.length < 2 || e.target.closest(".pn")) return; x0 = e.clientX; dx = 0; w = el.clientWidth; t.style.transition = "none"; el.setPointerCapture(e.pointerId); });
  el.addEventListener("pointermove", e => { if (x0 === null) return; dx = e.clientX - x0; t.style.transform = `translateX(calc(${-i * 100}% + ${dx}px))`; });
  const end = () => { if (x0 === null) return; const d = dx; x0 = null; go(Math.abs(d) > w * 0.15 ? i + (d < 0 ? 1 : -1) : i); };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
  go(0);
}
document.querySelectorAll("#feed .gal").forEach(el => { const p = SITE.projects[+el.dataset.p]; if (p.images && p.images.length) buildSlider(el, p.images, p.title, p.badge); });

$("post").onclick = () => { const t = $("msg").value.trim(); location.href = "mailto:" + SITE.email + "?subject=" + encodeURIComponent("Hello from your portfolio") + "&body=" + encodeURIComponent(t); };

const ICON = {
  home: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 11.5 12 4l9 7.5V21h-6v-6H9v6H3z"/></svg>',
  about: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4.2"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>',
  projects: '<svg viewBox="0 0 24 24" fill="currentColor">' + [3, 9.5, 16].flatMap(y => [3, 9.5, 16].map(x => `<rect x="${x}" y="${y}" width="5" height="5" rx=".6"/>`)).join("") + '</svg>',
  contact: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5 12 13l8.5-6.5" fill="none" stroke="#fff" stroke-width="1.8"/></svg>'
};
const LABEL = { home: "Home", about: "About me", projects: "Projects" };
const VIEWS = Object.keys(LABEL);
$("segs").innerHTML = VIEWS.map(v => `<a href="#${v}" aria-label="${LABEL[v]}">${ICON[v]}${LABEL[v]}</a>`).join("");
function route() {
  const h = location.hash.slice(1), v = VIEWS.includes(h) ? h : "home";
  document.querySelectorAll("[data-view]").forEach(s => s.hidden = s.dataset.view !== v);
  document.querySelectorAll(".segs a").forEach(a => a.getAttribute("href") === "#" + v ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  $("here").textContent = { home: "Portfolio", about: "About me", projects: "Projects" }[v];
  window.scrollTo(0, 0);
  if (h === "contact") setMenu(true);
}
const lb = $("lb");
function setLb(open) { if (open && !SITE.avatar) return; lb.hidden = !open; if (open) { $("lbImg").src = SITE.avatar; $("lbImg").alt = SITE.name; $("lbx").focus(); } else $("avatar").focus(); }
$("avatar").onclick = () => setLb(true);
lb.onclick = e => { if (e.target !== $("lbImg")) setLb(false); };
addEventListener("keydown", e => { if (e.key === "Escape" && !lb.hidden) setLb(false); });
const menu = $("menu"), cbtn = $("cbtn");
function setMenu(open) { menu.hidden = !open; cbtn.setAttribute("aria-expanded", String(open)); }
cbtn.onclick = () => setMenu(menu.hidden);
addEventListener("click", e => { if (!menu.hidden && !menu.contains(e.target) && !cbtn.contains(e.target)) setMenu(false); });
addEventListener("keydown", e => { if (e.key === "Escape") setMenu(false); });
addEventListener("hashchange", route); route();
</script>
</body>
</html>

</body></html>
